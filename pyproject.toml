[project]
name = "rtfm"
version = "0.1.0"
description = "Answers Git questions from the Pro Git book: Redis vector search, Gemini, semantic cache and memory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "google-genai==2.25.0",
    "numpy==2.4.6",
    "redis==8.1.0",
    "uvicorn==0.54.0",
    "wordllama==0.4.0.post1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
